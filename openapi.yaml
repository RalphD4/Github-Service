# openapi spec written by Katherine Li
openapi: 3.1.0
info:
  title: Github CRUD API
  description: This API allows for CRUD for Github Issues.
  version: 0.0.1

servers:
  - url: http://localhost:8000

paths:
  /issues:
    post:
      summary: Create an issue
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIssue' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string }, example: /issues/42 }
          content: { application/json: { schema: { $ref: '#/components/schemas/Issue' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List issues
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, closed, all], default: open } }
        - { name: labels, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses: {'200': { description: Issue list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Issue' } } } } } }
  /issues/{number}:
    parameters: [{ name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }]
    get:
      summary: Get an issue by number
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Issue, content: { application/json: { schema: { $ref: '#/components/schemas/Issue' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update an issue
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateIssue' } } } }
      responses: {'200': { description: Updated issue, content: { application/json: { schema: { $ref: '#/components/schemas/Issue' } } } } }
  /issues/{number}/comments:
    post:
      summary: Add a comment
      security: [{ bearerAuth: [] }]
      parameters: [{ name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateComment' } } } }
      responses: {'201': { description: Created comment, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } } }
  /webhook:
    post:
      summary: Receive GitHub webhook
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string, enum: [issues, issue_comment, ping] } }
        - { name: X-GitHub-Delivery, in: header, schema: { type: string } }
      responses: {'204': { description: Accepted }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    CreateIssue:
      type: object
      required: [title]
      properties: { title: { type: string, minLength: 1 }, body: { type: [string, 'null'] }, labels: { type: array, items: { type: string } } }
    UpdateIssue:
      type: object
      minProperties: 1
      properties: { title: { type: string, minLength: 1 }, body: { type: [string, 'null'] }, state: { type: string, enum: [open, closed] } }
    CreateComment: { type: object, required: [body], properties: { body: { type: string, minLength: 1 } } }
    Issue: { type: object, properties: { number: { type: integer }, html_url: { type: string, format: uri }, state: { type: string }, title: { type: string }, body: { type: [string, 'null'] }, labels: { type: array }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    Comment: { type: object, properties: { id: { type: integer }, body: { type: string }, user: { type: object }, created_at: { type: string, format: date-time }, html_url: { type: string, format: uri } } }
    Error: { type: object, required: [error, message], properties: { error: { type: string }, message: { type: string }, details: { type: object } } }
  responses:
    BadRequest: { description: Invalid request or GitHub validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing or invalid token/signature, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Issue not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
