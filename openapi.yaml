openapi: 3.1.0
info:
  title: Github CRUD API
  description: This API allows for CRUD for Github Issues.
  version: 0.0.1

paths:
  /issues:
    get:
      summary: List all issues
      parameters:
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/Labels"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A list of all issues for this repository
          headers:
            Link:
              description: Links preserving Github pagination semantics
              schema:
              type: string
              example: '<https://api.github.com/repos/o/r/issues?page=2>; rel="next"'
            content:
              application/json:
                schema:
                  type: array
                  items: 
                    $ref: "#/components/schemas/Issue"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Issue created
          headers:
            Location:
              description: URL of the created issue
              schema:
                type: string
                example: /issues/42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
              example:
                error: validation_error
                message: "Field 'title' is required and must not be empty."
                details:
                  field: title
        "401":
          description: Missing/Invalid token
          $ref: "#/components/responses/Unauthorized"

  /issues/{number}:
    parameters:
      - $ref: "#/components/parameters/IssueNumber"

    get:
      summary: Get an issue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Issue not found
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update an issue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Missing/Invalid update fields
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Issue number not found
          $ref: "#/components/responses/NotFound"

  /issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueNumber"

    post:
      summary: Add comment to an issue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment added to issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Missing/Invalid comment fields
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Issue number not found
          $ref: "#/components/responses/NotFound"

  /webhook:
    post:
      summary: Receive GitHub webhook events
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: HMAC SHA-256 signature generated using WEBHOOK_SECRET.
          schema:
            type: string
            example: sha256=abc123
        - name: X-GitHub-Event
          in: header
          required: true
          description: GitHub event type.
          schema:
            type: string
            enum:
              - issues
              - issue_comment
              - ping
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: Unique delivery ID used for retry-safe handling.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Event accepted and persisted.
        "400":
          description: Unknown event or action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid webhook signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  parameters:
    IssueNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 42

  State:
    State:
      name: state
      in: query
      required: false
      description: State of issue
      schema:
        type: string
        enum:
          - open
          - closed
          - all
        default: open

    Labels:
      name: labels
      in: query
      required: false
      description: Issue labels (comma separated list)
      schema:
        type: string
        example: low-priority,bug,backend

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  schemas:
    CreateIssueRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          example: Fix login issue
        body:
          type: string
          nullable: true
          example: Users cannot log in with valid credentials
        labels:
          type: array
          items:
            type: string
          example:
            - bug
            - authentication
  responses:
    BadRequest:
      description: Invalid payload or external validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Missing or invalid GitHub token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Issue number not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"


